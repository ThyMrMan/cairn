services:
  cairn:
    image: ghcr.io/you/cairn:latest
    # For a local build instead of the published image:
    # build: .
    container_name: cairn
    restart: unless-stopped
    ports:
      - "8080:8080"   # web UI
      - "8081:8081"   # archive replay (pywb), deliberately a separate origin
    volumes:
      - ./config:/config          # database + settings. Put this on an SSD.
      - ./data:/data              # WARC storage. Bulk; an array is fine.
      # Uncomment to import an existing ArchiveBox. Read-only is enough — the
      # importer copies WARCs out and never writes to the source.
      # - /mnt/user/archivebox:/import:ro
      # Uncomment for container engines (browsertrix). READ docs/11 FIRST:
      # the Docker socket grants root-equivalent control of this host. Without
      # it the engine shows as unavailable and everything else works as before.
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Generate with: openssl rand -base64 48
      # Losing this makes stored cookie jars unrecoverable.
      - CAIRN_SECRET_KEY=${CAIRN_SECRET_KEY:?set CAIRN_SECRET_KEY in .env}
      # These MUST differ in hostname, not just port. Ports do not isolate
      # cookies, so a shared hostname lets archived JavaScript read your
      # session (docs/07, docs/11).
      - CAIRN_APP_PUBLIC_URL=${CAIRN_APP_PUBLIC_URL:-}
      - CAIRN_REPLAY_PUBLIC_URL=${CAIRN_REPLAY_PUBLIC_URL:-}
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=${TZ:-Etc/UTC}
    # Chromium crashes on Docker's default 64MB /dev/shm. It is used by
    # userscript and interactive profiles, browser-based discovery, and site
    # thumbnails; everything else works without it.
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
