name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, because the advisories move while the code does not. An archiver
  # that nobody has committed to in three months still gains vulnerabilities in
  # pywb's and Chromium's dependency trees, and a scan that only runs on push
  # is a scan that never runs on the repository this most applies to.
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

      - name: Migrations are reversible
        # A downgrade nobody ever runs is a downgrade that does not work. The
        # first time it matters is the worst time to find out.
        env:
          CAIRN_CONFIG_DIR: /tmp/cairn-ci/config
          CAIRN_DATA_DIR: /tmp/cairn-ci/data
        run: |
          mkdir -p "$CAIRN_CONFIG_DIR" "$CAIRN_DATA_DIR"
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Schema matches the models
        # Catches a model edited without a matching migration.
        env:
          CAIRN_CONFIG_DIR: /tmp/cairn-check/config
          CAIRN_DATA_DIR: /tmp/cairn-check/data
        run: |
          mkdir -p "$CAIRN_CONFIG_DIR" "$CAIRN_DATA_DIR"
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend (types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      # Lets the run push to GHCR with the token GitHub mints for it. No
      # personal access token exists anywhere for this — not in a secret, not
      # on a laptop, not in anybody's shell history.
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cairn:ci
          # Stamped with the commit that produced it. `__version__` reads
          # 1.0.0 on every commit of a release series, so this is the part
          # that answers "which build is running" — see services/build.py.
          build-args: |
            CAIRN_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and reports healthy
        run: |
          docker run -d --name cairn-ci \
            -p 8080:8080 \
            -e CAIRN_SECRET_KEY="$(openssl rand -base64 48)" \
            -e PUID=1000 -e PGID=1000 \
            cairn:ci

          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              curl -sS http://localhost:8080/api/health
              exit 0
            fi
            sleep 1
          done

          echo "::error::container never became healthy"
          docker logs cairn-ci
          exit 1

      # The image is the largest part of the attack surface and the part
      # nothing else here looks at: pywb and Chromium bring a Debian userland
      # with them. Scanned from the official container rather than through a
      # third-party action, so this file keeps depending only on actions
      # GitHub publishes.
      - name: Vulnerabilities in the image
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:latest image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --format table \
              cairn:ci | tee trivy.txt
          {
            echo "### Image advisories (HIGH/CRITICAL, fixed upstream)"
            echo '```'
            tail -c 60000 trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── publish ──────────────────────────────────────────────────────────
      #
      # Only from this repository's own main branch and version tags. A pull
      # request — including one from a fork, which is the case that matters —
      # builds and is health-checked and scanned, and publishes nothing.
      #
      # What is pushed is the image that was just started and answered
      # /api/health, re-tagged. Not a rebuild: a second `docker build` would
      # be a different artifact from the one the evidence is about, however
      # identical the inputs look.
      - name: Publish to GHCR
        if: >-
          github.event_name != 'pull_request' &&
          github.repository == 'ThyMrMan/cairn' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE: ghcr.io/thymrman/cairn
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Always the commit, so any running container can be traced back to
          # a tree. `latest` follows main; a v-tag also publishes its version.
          docker tag cairn:ci "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:${GITHUB_SHA}"

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag cairn:ci "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

          case "$GITHUB_REF" in
            refs/tags/v*)
              version="${GITHUB_REF#refs/tags/v}"
              docker tag cairn:ci "$IMAGE:$version"
              docker push "$IMAGE:$version"
              ;;
          esac

          docker logout ghcr.io

          {
            echo "### Published"
            echo '```'
            docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep ghcr.io || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs
        if: always()
        run: docker logs cairn-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f cairn-ci || true

  # ── advisories ───────────────────────────────────────────────────────────
  #
  # Reported, never blocking, and that is a decision rather than laziness.
  # The image deliberately pins setuptools below 81 because pywb still imports
  # `pkg_resources`, which was removed there — and pywb in turn requires
  # Werkzeug 2.2.3 exactly. "Upgrade until the scanner is quiet" is not always
  # a move that exists here, and a gate that cannot be satisfied is one that
  # gets switched off, after which nothing is scanned at all. The findings go
  # to the run summary, where a human decides between a version bump, a
  # workaround, and living with it. See docs/11.
  audit:
    name: Dependencies (advisories only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Python advisories
        continue-on-error: true
        run: |
          {
            echo "### Python packages"
            pip-audit --desc on --format markdown || echo "_pip-audit reported findings._"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend advisories
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci || npm install
          {
            echo "### npm packages"
            echo '```'
            npm audit --audit-level=high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
