name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

      - name: Migrations are reversible
        # A downgrade nobody ever runs is a downgrade that does not work. The
        # first time it matters is the worst time to find out.
        env:
          CAIRN_CONFIG_DIR: /tmp/cairn-ci/config
          CAIRN_DATA_DIR: /tmp/cairn-ci/data
        run: |
          mkdir -p "$CAIRN_CONFIG_DIR" "$CAIRN_DATA_DIR"
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Schema matches the models
        # Catches a model edited without a matching migration.
        env:
          CAIRN_CONFIG_DIR: /tmp/cairn-check/config
          CAIRN_DATA_DIR: /tmp/cairn-check/data
        run: |
          mkdir -p "$CAIRN_CONFIG_DIR" "$CAIRN_DATA_DIR"
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend (types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cairn:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and reports healthy
        run: |
          docker run -d --name cairn-ci \
            -p 8080:8080 \
            -e CAIRN_SECRET_KEY="$(openssl rand -base64 48)" \
            -e PUID=1000 -e PGID=1000 \
            cairn:ci

          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              curl -sS http://localhost:8080/api/health
              exit 0
            fi
            sleep 1
          done

          echo "::error::container never became healthy"
          docker logs cairn-ci
          exit 1

      - name: Logs
        if: always()
        run: docker logs cairn-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f cairn-ci || true
