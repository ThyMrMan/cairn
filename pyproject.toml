[project]
name = "cairn"
version = "0.1.0"
description = "Self-hosted website archiver — crawls whole sites to WARC, replays them in the browser."
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "pyotp>=2.9",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "httpx>=0.28",
    # Sitemap parsing reads attacker-controlled XML. The stdlib parsers are
    # vulnerable to entity expansion by default (docs/11).
    "defusedxml>=0.7",
    "feedparser>=6.0",
    # Public Suffix List, so example.co.uk and other.co.uk do not group as "uk".
    "tldextract>=5.1",
    # Reads captured HTML back out of the WARC to report assets a page
    # referenced but the crawl never fetched — the backstop for scope rules
    # that can drop extension-less images (docs/04).
    "warcio>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-pyyaml",
    "types-jsonschema",
]

[project.scripts]
cairn = "cairn.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["cairn*"]

[tool.setuptools.package-data]
# Built-in engine manifests and the built SPA ship inside the package; without
# this an installed wheel has no engines and serves no UI.
cairn = ["engines/builtin/*/engine.yaml", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF", "S"]
ignore = [
    "S101",  # assert — used in tests
    "B008",  # function call in default arg — FastAPI Depends idiom
]

[tool.ruff.lint.isort]
known-first-party = ["cairn", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hardcoded test passwords
# Migrations are generated by `alembic revision --autogenerate`; reformatting
# them by hand makes every future regeneration a diff fight.
"backend/cairn/db/migrations/versions/*" = ["E501", "W291", "I001", "N999"]
"backend/cairn/db/migrations/env.py" = ["I001", "N999", "F403", "F405"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["cairn"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "cairn.db.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
# These ship no py.typed marker.
module = ["warcio.*", "defusedxml.*", "feedparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:cairn.*"]
